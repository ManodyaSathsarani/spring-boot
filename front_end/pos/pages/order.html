<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #458178;
            background-image:
                    radial-gradient(1200px 600px at 10% 0%, rgba(99,102,241,.20), transparent 60%),
                    radial-gradient(900px 500px at 90% 10%, rgba(16,185,129,.15), transparent 55%),
                    radial-gradient(900px 600px at 50% 100%, rgba(236,72,153,.10), transparent 55%);
            min-height:100vh;
        }

        .app-shell{ max-width:1100px; }

        .navbar{
            border-bottom:1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            background: rgba(74,149,141,0.7) !important;
        }
        .navbar .navbar-brand{ font-weight:800; letter-spacing:.3px; }
        .nav-link{ font-weight:600; opacity:.9; }
        .nav-link:hover{ opacity:1; }

        .card{
            border:1px solid rgba(255,255,255,.08);
            background: rgba(48,135,42,.75);
            color:#e5e7eb;
            border-radius:18px;
        }

        .section-title{
            font-weight:900;
            letter-spacing:.2px;
            color:#f8fafc;
        }
        .subtle{ color: rgba(229,231,235,.75); }

        .card .form-label{
            color: rgba(229,231,235,.85);
            font-weight:600;
        }

        .form-control,.form-select{
            background: rgba(2,6,23,.55);
            border:1px solid rgba(255,255,255,.10);
            color:#e5e7eb;
            border-radius:14px;
        }

        .form-control:focus,.form-select:focus{
            background: rgba(2,6,23,.65);
            border-color: rgba(99,102,241,.60);
            box-shadow: 0 0 0 .25rem rgba(99,102,241,.15);
            color:#fff;
        }

        .btn{
            border-radius:14px;
            font-weight:700;
        }
        .btn-primary{ box-shadow: 0 10px 20px rgba(99,102,241,.14); }
        .btn-primary{ box-shadow: 0 10px 20px rgba(34,197,94,.15); }
        .btn-primary{ box-shadow: 0 10px 20px rgba(239,68,68,.12); }

        .table-wrap{
            border-radius:18px;
            overflow:hidden;
            border:1px solid rgba(255,255,255,.08);
        }

        .table{ margin-bottom:0; }
        .table-dark{
            --bs-table-bg: rgba(2,6,23,.75);
            --bs-table-border-color: rgba(255,255,255,.10);
        }
        .table-bordered > :not(caption) > *{
            border-color: rgba(255,255,255,.10);
        }
        .table-hover tbody tr:hover{
            background: rgba(99,102,241,.10);
        }

        .muted-hr{
            border-top:1px solid rgba(255,255,255,.08);
            opacity:1;
        }

        .top-bar{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:12px;
            margin-bottom:16px;
        }

        .badge-soft{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:8px 12px;
            border-radius:999px;
            background: rgba(99,102,241,.12);
            border:1px solid rgba(99,102,241,.25);
            color:#c7d2fe;
            font-weight:700;
            font-size:.85rem;
            white-space:nowrap;
        }

        .mini-help{
            display:block;
            color: rgba(229,231,235,.65) !important;
            font-size: .85rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">MINI POS SYSTEM</a>

        <div class="ms-auto">
            <a class="nav-link d-inline text-white me-3" href="../index.html">Home</a>
            <a class="nav-link d-inline text-white me-3" href="customer.html">Customer</a>
            <a class="nav-link d-inline text-white me-3" href="item.html">Item</a>
            <a class="nav-link d-inline text-white" href="order.html">Order</a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="row">

        <!-- Order Section -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow p-4 h-100">

                <h5 class="fw-bold mb-3">Order Details</h5>

                <div class="mb-3">
                    <label class="form-label">Order ID</label>
                    <input type="text" id="orderId" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Customer</label>
                    <select id="cusSelect" class="form-select"></select>
                    <small class="text-light">Name: <span id="cusNameView">-</span></small>
                </div>

                <hr>

                <div class="mb-3">
                    <label class="form-label">Item</label>
                    <select id="itemSelect" class="form-select"></select>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <input type="text" id="itemName" class="form-control" placeholder="Item Name" disabled>
                    </div>
                    <div class="col-6 mb-3">
                        <input type="text" id="unitPrice" class="form-control" placeholder="Unit Price" disabled>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <input type="text" id="availableQty" class="form-control" placeholder="Available Qty" disabled>
                    </div>
                    <div class="col-6 mb-3">
                        <input type="number" id="orderQty" class="form-control" placeholder="Order Qty">
                    </div>
                </div>

                <button class="btn btn-primary w-100" id="btnAddToCart">Add To Cart</button>

            </div>
        </div>

        <!-- Cart Section -->
        <div class="col-lg-8">
            <div class="card shadow p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold">Cart</h5>
                    <h5>Total: <span id="grandTotal" class="text-success">0.00</span></h5>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover text-center align-middle">
                        <thead class="table-success">
                        <tr>
                            <th>Item ID</th>
                            <th>Name</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="cartBody"></tbody>
                    </table>
                </div>

                <button class="btn btn-primary w-100 mt-3" id="btnPlaceOrder">
                    Place Order
                </button>

            </div>
        </div>

    </div>

</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- SweetAlert2 (add this BEFORE your main script) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ✅ SCRIPT UNCHANGED -->
<script>
    const CUSTOMER_URL = "http://localhost:8080/app/v1/customer";
    const ITEM_URL = "http://localhost:8080/app/v1/item";
    const ORDER_URL = "http://localhost:8080/app/v1/order";

    let customers = [];
    let items = [];
    let cart = []; // { itemId, name, qty, unitPrice, total }

    // ✅ SweetAlert2 helpers (only UI, no logic changes)
    function showError(msg) {
        Swal.fire({
            icon: "error",
            title: "Oops...",
            text: msg
        });
    }

    function showSuccess(msg) {
        Swal.fire({
            icon: "success",
            title: "Success",
            text: msg,
            timer: 1500,
            showConfirmButton: false
        });
    }

    function money(n) { return Number(n || 0).toFixed(2); }

    function clearItemInputs() {
        $("#itemName").val("");
        $("#unitPrice").val("");
        $("#availableQty").val("");
        $("#orderQty").val("");
    }

    function renderCart() {
        $("#cartBody").empty();

        cart.forEach((c, idx) => {
            $("#cartBody").append(`
        <tr>
          <td>${c.itemId}</td>
          <td>${c.name}</td>
          <td>${c.qty}</td>
          <td>${money(c.unitPrice)}</td>
          <td>${money(c.total)}</td>
          <td><button class="btn btn-sm btn-danger btnRemove" data-index="${idx}">Remove</button></td>
        </tr>
      `);
        });

        const grandTotal = cart.reduce((sum, x) => sum + Number(x.total), 0);
        $("#grandTotal").text(money(grandTotal));
    }

    function loadNextOrderId() {
        $.ajax({
            url: ORDER_URL + "/next-id",
            method: "GET",
            success: function (id) {
                $("#orderId").val(id);
            },
            error: function () {
                $("#orderId").val("Auto");
            }
        });
    }

    function loadCustomers() {
        $.ajax({
            url: CUSTOMER_URL,
            method: "GET",
            dataType: "json",
            success: function (resp) {
                customers = resp?.data || [];   // ✅ important

                $("#cusSelect").empty().append(`<option value="">-- Select Customer --</option>`);
                customers.forEach((c) => {
                    $("#cusSelect").append(`<option value="${c.cId}">${c.cId}</option>`);
                });
            },
            error: function (xhr) {
                console.log(xhr.responseText);
                showError("Customer load failed: " + (xhr.responseText || xhr.status));
            }
        });
    }

    function loadItems() {
        $.ajax({
            url: ITEM_URL,
            method: "GET",
            dataType: "json",
            success: function (resp) {
                items = resp?.data || [];  // ✅ important

                $("#itemSelect").empty().append(`<option value="">-- Select Item --</option>`);
                items.forEach((i) => {
                    $("#itemSelect").append(`<option value="${i.id}">${i.id}</option>`);
                });
            },
            error: function (xhr) {
                console.log(xhr.responseText);
                showError("Item load failed: " + (xhr.responseText || xhr.status));
            }
        });
    }


    $("#cusSelect").on("change", function () {
        const cid = Number($(this).val());
        const cus = customers.find((c) => c.cId === cid);
        $("#cusNameView").text(cus ? cus.cName : "-");
    });

    $("#itemSelect").on("change", function () {
        const itemId = Number($(this).val());
        const it = items.find((i) => i.id === itemId);

        if (!it) {
            clearItemInputs();
            return;
        }

        $("#itemName").val(it.name);
        $("#unitPrice").val(money(it.price));
        $("#availableQty").val(it.qty);
        $("#orderQty").val(1).focus();
    });

    $("#btnAddToCart").on("click", function () {
        const customerId = Number($("#cusSelect").val());
        const itemId = Number($("#itemSelect").val());
        const qty = Number($("#orderQty").val());

        if (!customerId) return showError("Select a customer!");
        if (!itemId) return showError("Select an item!");
        if (!qty || qty <= 0) return showError("Enter valid order qty!");

        const it = items.find((i) => i.id === itemId);
        if (!it) return showError("Invalid item!");

        const available = Number(it.qty);
        if (qty > available) return showError(`Not enough stock! Available: ${available}`);

        const existing = cart.find((c) => c.itemId === itemId);
        const newCartQty = existing ? existing.qty + qty : qty;

        if (newCartQty > available) return showError(`Cart qty exceeds available stock! Available: ${available}`);

        if (existing) {
            existing.qty = newCartQty;
            existing.total = existing.qty * existing.unitPrice;
        } else {
            cart.push({
                itemId: it.id,
                name: it.name,
                qty: qty,
                unitPrice: Number(it.price),
                total: qty * Number(it.price)
            });
        }

        renderCart();
        $("#orderQty").val(1);
    });

    $("#cartBody").on("click", ".btnRemove", function () {
        const idx = Number($(this).data("index"));
        cart.splice(idx, 1);
        renderCart();
    });

    $("#btnPlaceOrder").on("click", function () {
        const customerId = Number($("#cusSelect").val());
        if (!customerId) return showError("Select a customer!");
        if (cart.length === 0) return showError("Cart is empty!");

        // ✅ do NOT send orderId
        const orderPayload = {
            customerId: customerId,
            items: cart.map((c) => ({
                itemId: c.itemId,
                qty: c.qty,
                unitPrice: c.unitPrice
            })),
            total: Number(cart.reduce((sum, x) => sum + Number(x.total), 0))
        };

        $.ajax({
            url: ORDER_URL,
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(orderPayload),
            success: function () {
                showSuccess("Order placed ✅");

                cart = [];
                renderCart();
                $("#cusSelect").val("");
                $("#cusNameView").text("-");
                $("#itemSelect").val("");
                clearItemInputs();

                loadItems();
                loadNextOrderId(); // ✅ refresh preview
            },
            error: function (xhr) {
                console.log(xhr.responseText);
                showError("Place order failed: " + (xhr.responseText || xhr.status));
            }
        });
    });

    $(document).ready(function () {
        loadCustomers();
        loadItems();
        renderCart();
        loadNextOrderId();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
